    <main>
      <h1>Copias de seguridad</h1>
      <p>
        La copia de seguridad protege los datos del equipo. Para recuperar un
        archivo, seleccione una copia reciente y compruebe su contenido.
      </p>
      <p>
        El sistema conserva los archivos durante treinta días. Puede cambiar
        este plazo en la configuración.
      </p>
    </main>
